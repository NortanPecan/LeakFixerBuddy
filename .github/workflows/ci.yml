##
## CI Pipeline — LeakFixer Buddy
##
## Runs on every push and pull request.
## Jobs: lint → test → build (in parallel where possible)
## Deployment to Vercel is handled by Vercel's GitHub integration — not here.
##

name: CI

on:
  push:
    branches: ["main", "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.10"
  # Stub env vars so Next.js build doesn't fail on missing secrets
  # Real secrets are injected by Vercel — never commit them here
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/leakfixer?schema=public"
  DIRECT_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/leakfixer?schema=public"
  AUTH_SESSION_SECRET: "ci-test-secret-at-least-32-chars-long-placeholder"

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Check encoding
        run: node scripts/check-encoding.js

      - name: Lint (ESLint)
        # Baseline: ~370 pre-existing warnings (no-explicit-any, exhaustive-deps, etc.)
        # Reduce this number over time. 0 errors is enforced regardless.
        run: bun x eslint . --max-warnings=500

      - name: Check formatting (Prettier)
        run: bun run format:check

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run Vitest
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Build (type-check + Next.js build) ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lockb') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lockb') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: TypeScript error count (non-blocking)
        # Reports pre-existing TS errors as a baseline. Does not fail CI.
        # Goal: reduce this count to 0 over time, then replace with strict check.
        run: |
          count=$(bun x tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "TypeScript errors: $count (baseline: 106)"
          if [ "$count" -gt 150 ]; then
            echo "::error::TypeScript error count ($count) exceeds ceiling of 150 — fix before merging"
            exit 1
          fi

      - name: Next.js build
        run: bun x next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
